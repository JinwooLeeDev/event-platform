spring:
  application:
    name: event-platform
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    defer-datasource-initialization: true   # data.sql 파일을 넣으려면 필요. 새로 추가.
server:
  port: ${SERVER_PORT:8080}


