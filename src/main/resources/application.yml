app:

  mail:
    from: ${MAIL_FROM}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    max-size: 10485760
  business-verification: # 사업자 등록증 확인 API
    base-url: https://api.odcloud.kr/api/nts-businessman/v1
    service-key: ${NTS_SERVICE_KEY}
spring:
  application:
    name: jdbc:h2:mem:event_platform;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    defer-datasource-initialization: true   # data.sql 파일을 넣으려면 필요. 새로 추가.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
server:
  port: ${SERVER_PORT:8080}

portone:
  naver-store-id: ${NAVER_STORE_ID}
  naver-channel-key: ${NAVER_CHANNEL_KEY}
  naver-secret-key: ${NAVER_SECRET_KEY}

  kakao-store-id: ${KAKAO_STORE_ID}
  kakao-channel-key: ${KAKAO_CHANNEL_KEY}
  kakao-secret-key: ${KAKAO_SECRET_KEY}

naver-map:
  client-id: ${NAVER_MAP_CLIENT_ID:}
  client-secret: ${NAVER_MAP_CLIENT_SECRET:}

# 2-A infrastructure only. Apply db/manual/event-translation.sql manually before enabling workers.
# No model fallback or paid-tier switching. GEMINI_MODEL is deliberately explicit.
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:}
    worker-enabled: ${GEMINI_TRANSLATION_WORKER_ENABLED:false}
    timeout: ${GEMINI_TIMEOUT:30s}
    lease: ${GEMINI_LEASE:2m}
    poll-interval: ${GEMINI_POLL_INTERVAL:5000}
    backoff: ${GEMINI_BACKOFF:30s}
    max-retries: ${GEMINI_MAX_RETRIES:2}
    max-concurrent: ${GEMINI_MAX_CONCURRENT:1}
    requests-per-minute: ${GEMINI_REQUESTS_PER_MINUTE:5}
    requests-per-day: ${GEMINI_REQUESTS_PER_DAY:100}
    max-source-chars: ${GEMINI_MAX_SOURCE_CHARS:10000}
    max-output-chars: ${GEMINI_MAX_OUTPUT_CHARS:40000}

