app:

  mail:
    from: ${MAIL_FROM}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    max-size: 10485760
  business-verification: # 사업자 등록증 확인 API
    base-url: https://api.odcloud.kr/api/nts-businessman/v1
    service-key: ${NTS_SERVICE_KEY}
spring:
  application:
    name: event-platform
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    defer-datasource-initialization: true   # data.sql 파일을 넣으려면 필요. 새로 추가.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
server:
  port: ${SERVER_PORT:8080}

portone:
  store-id: ${NAVER_STORE_ID}
  channel-key: ${NAVER_CHANNEL_KEY}
  secret-key: ${NAVER_SECRET_KEY}

naver-map:
  client-id: ${NAVER_MAP_CLIENT_ID}
  client-secret: ${NAVER_MAP_CLIENT_SECRET}

