spring:
  application:
    name: event-platform
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: mysql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
