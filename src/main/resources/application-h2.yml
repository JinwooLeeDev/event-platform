spring:
  datasource:
    url: jdbc:h2:mem:event_platform;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  sql:
    init:
      mode: always # never --> always로 변경
      data-locations:
        - classpath:db/local-mysql/data.sql # # data.sql 파일 읽기위한 설정.

