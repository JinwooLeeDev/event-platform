spring:
  datasource:
    url: jdbc:h2:file:./data/event_platform
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  sql:
    init:
      mode: always
      encoding: UTF-8
      data-locations:
        - classpath:db/demo-data.sql
        - classpath:db/showcase-data.sql

